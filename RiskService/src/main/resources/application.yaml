server:
  port: 8084

spring:
  application:
    name: RISK-SERVICE

  r2dbc:
    url: r2dbc:mysql://localhost:3306/risk_db
    username: root
    password: Ratna@1234

  sql:
    init:
      mode: always

services:
  application-service:
    url: http://localhost:8082
  policy-service:
    url: http://localhost:8085

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

info:
  app:
    name: risk Service
    version: 1.0
    description: risk Microservice

jwt:
  secret: mySecretKeyForRealEstateProjectDelayInsurancePlatform2026SecureKey

logging:
  level:
    root: INFO
    org.example.riskservice: DEBUG
    org.springframework.r2dbc: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"