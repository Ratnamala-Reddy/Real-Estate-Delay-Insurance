server:
  port: 8082

spring:
  application:
    name: APPLICATION-SERVICE

  r2dbc:
    url: r2dbc:mysql://localhost:3306/insurance_db
    username: root
    password: Ratna@1234

  sql:
    init:
      mode: always
      schema-location: classpath:schema.sql

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: mySecretKeyForRealEstateProjectDelayInsurancePlatform2026SecureKey

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

info:
  app:
    name: Application Service
    version: 1.0
    description: Application Microservice

logging:
  level:
    root: INFO
    org.example.applicationservice: DEBUG
    org.springframework.r2dbc: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"