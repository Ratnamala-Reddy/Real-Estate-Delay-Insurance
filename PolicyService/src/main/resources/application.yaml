server:
  port: 8085

spring:
  application:
    name: POLICY-SERVICE

  r2dbc:
    url: r2dbc:mysql://localhost:3306/policy_db
    username: root
    password: Ratna@1234

  sql:
    init:
      mode: always

services:
  application-service:
    url: http://localhost:8082
  risk-service:
    url: http://localhost:8084

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

info:
  app:
    name: policy Service
    version: 1.0

jwt:
  secret: mySecretKeyForRealEstateProjectDelayInsurancePlatform2026SecureKey

logging:
  level:
    root: INFO
    org.example.policyservice: DEBUG
    org.springframework.r2dbc: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"