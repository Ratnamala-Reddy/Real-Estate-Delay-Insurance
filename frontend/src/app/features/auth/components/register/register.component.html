<div class="auth-wrapper">
  <div class="card auth-card">
    <div class="auth-header">
      <h2 class="auth-title">Create Account</h2>
      <p class="auth-subtitle">Register to protect your property purchase against delays</p>
    </div>

    <div *ngIf="error$ | async as error" class="alert alert-danger">
      {{ error }}
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="firstName">First Name</label>
          <input
            id="firstName"
            type="text"
            formControlName="firstName"
            class="form-control"
            placeholder="John"
          />
          <div class="form-error" *ngIf="registerForm.get('firstName')?.touched && registerForm.get('firstName')?.invalid">
            First name is required.
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="lastName">Last Name</label>
          <input
            id="lastName"
            type="text"
            formControlName="lastName"
            class="form-control"
            placeholder="Doe"
          />
          <div class="form-error" *ngIf="registerForm.get('lastName')?.touched && registerForm.get('lastName')?.invalid">
            Last name is required.
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="regEmail">Email Address</label>
        <input
          id="regEmail"
          type="email"
          formControlName="email"
          class="form-control"
          placeholder="john.doe@example.com"
        />
        <div class="form-error" *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid">
          Please enter a valid email address.
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="mobileNumber">Mobile Number (10 Digits)</label>
        <input
          id="mobileNumber"
          type="tel"
          formControlName="mobileNumber"
          class="form-control"
          placeholder="9876543210"
          maxlength="10"
        />
        <div class="form-error" *ngIf="registerForm.get('mobileNumber')?.touched && registerForm.get('mobileNumber')?.invalid">
          Must be exactly 10 numeric digits.
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="regPassword">Password (Min 8 characters)</label>
        <input
          id="regPassword"
          type="password"
          formControlName="password"
          class="form-control"
          placeholder="••••••••"
        />
        <div class="form-error" *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid">
          Password must have at least 8 characters.
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="(loading$ | async)">
        <span *ngIf="!(loading$ | async)">Register Account</span>
        <span *ngIf="(loading$ | async)">Creating Account...</span>
      </button>
    </form>

    <div class="auth-footer">
      <span>Already have an account?</span>
      <a routerLink="/auth/login">Sign in</a>
    </div>
  </div>
</div>
