<div class="min-h-[85vh] flex items-center justify-center px-4 py-12 bg-slate-50">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 p-8 sm:p-10 transition-all">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-rose-50 text-[#7B003F] text-2xl font-bold mb-3 shadow-sm border border-rose-100">
        🛡️
      </div>
      <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Sign In</h2>
      <p class="text-sm text-slate-500 mt-1">Access your policy dashboard and claim portals</p>
    </div>

    <div *ngIf="error$ | async as error" class="mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm flex items-start gap-3">
      <span class="text-red-500 font-bold">✕</span>
      <span>{{ error }}</span>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate class="space-y-5">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-2" for="email">Email Address</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-[#7B003F] focus:border-transparent text-sm transition-all duration-200 text-slate-800 placeholder-slate-400 bg-slate-50/50 focus:bg-white"
          placeholder="name@example.com"
          [class.border-red-500]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
        />
        <div class="mt-1.5 text-xs text-red-600 font-medium" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['required']">
          Email is required.
        </div>
        <div class="mt-1.5 text-xs text-red-600 font-medium" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['email']">
          Please enter a valid email format.
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-2" for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-[#7B003F] focus:border-transparent text-sm transition-all duration-200 text-slate-800 placeholder-slate-400 bg-slate-50/50 focus:bg-white"
          placeholder="••••••••"
          [class.border-red-500]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
        />
        <div class="mt-1.5 text-xs text-red-600 font-medium" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.errors?.['required']">
          Password is required.
        </div>
      </div>

      <button
        type="submit"
        class="w-full py-3.5 px-6 rounded-xl font-semibold text-white bg-[#7B003F] hover:bg-[#5C002B] shadow-lg shadow-rose-950/20 active:scale-[0.99] transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 cursor-pointer mt-2"
        [disabled]="(loading$ | async)"
      >
        <span *ngIf="!(loading$ | async)">Sign In</span>
        <span *ngIf="(loading$ | async)" class="flex items-center gap-2">
          <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          Authenticating...
        </span>
      </button>
    </form>

    <div class="mt-8 pt-6 border-t border-slate-100 text-center text-sm text-slate-600">
      <span>Don't have an account?</span>
      <a routerLink="/auth/register" class="ml-1.5 font-semibold text-[#7B003F] hover:text-[#5C002B] hover:underline transition-colors">Create one here</a>
    </div>
  </div>
</div>
