<div class="toast-container" *ngIf="toasts$ | async as toasts">
  <div *ngFor="let toast of toasts" class="toast" [ngClass]="'toast-' + toast.type">
    <div class="toast-icon">
      <span *ngIf="toast.type === 'success'">✓</span>
      <span *ngIf="toast.type === 'error'">✕</span>
      <span *ngIf="toast.type === 'warning'">⚠</span>
      <span *ngIf="toast.type === 'info'">ℹ</span>
    </div>
    <div class="toast-content">
      <div class="toast-title">{{ toast.title }}</div>
      <div class="toast-message">{{ toast.message }}</div>
    </div>
    <button class="toast-close" (click)="close(toast.id)" aria-label="Close notification">&times;</button>
  </div>
</div>
